<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#18211b;--ink:#eaf0e8;--mut:#93a08f;--line:#273329;--g:#5fbf86;--g2:#7fd3a2;--gold:#e0b04a;--soft:#1f2e24;--warn:#e08a55}}
:root[data-theme="dark"]{--bg:#101712;--card:#18211b;--ink:#eaf0e8;--mut:#93a08f;--line:#273329;--g:#5fbf86;--g2:#7fd3a2;--gold:#e0b04a;--soft:#1f2e24;--warn:#e08a55}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* launch */
#launch{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.brand b{font-size:26px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 28px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px}
.opt:active{transform:scale(.99)}
.opt small{color:var(--mut);display:block;margin-top:4px}
.opt h2{font-size:20px}
.opt.main{background:var(--g);border-color:var(--g);color:#fff}
.opt.main small{color:#d3e6da}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--g);margin-bottom:8px;font-weight:600}
.opt.main .tag{background:rgba(255,255,255,.18);color:#fff}
/* fundo com foto na tela de entrada */
#launch{position:relative}
#launch::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(10,28,18,.24),rgba(10,28,18,.10)),url(fundo-soja-milho.jpg) center/cover no-repeat}
@media (orientation:portrait){#launch::before{background-position:center,24% center}}
.brand b{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sub{color:#fff;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.75)}
.opt{box-shadow:0 8px 28px rgba(0,0,0,.22)}
/* marca Adam Agro */
.logo,.brand b,header .t b,.opt h2{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.logo{letter-spacing:-.04em}
.brand{gap:14px;margin-bottom:10px}
.brand .logo{width:54px;height:54px;border-radius:17px;font-size:23px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.brand b{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1}
header .t b{font-weight:800;letter-spacing:-.02em;font-size:17px}
.ag{color:var(--g)}
header .t b .ag{font-size:inherit;color:var(--g)}
.brand .ag{color:#f6cf6a}
/* app */
header.top{padding-top:env(safe-area-inset-top)}#syncSt[data-st="0"]{color:var(--warn)}#syncSt[data-st="1"]{color:var(--g)}
.two .btn{width:100%;padding:12px;font-size:15px}
#app{display:none;padding-bottom:84px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:720px;margin:0 auto}
header .logo{width:34px;height:34px;font-size:14px;border-radius:10px}
header .t{flex:1;line-height:1.15}
header .t b{display:block}header .t span{font-size:13px;color:var(--mut)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.view{display:none;padding-top:16px}.view.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-size:28px;display:block;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:13px}
.sec{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:700}
.vs{margin:6px 0 8px;font-size:15px}.vs i{font-style:normal;color:var(--mut);padding:0 4px}
.vs .c{color:var(--g);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.m{font-size:12.5px;background:var(--soft);padding:3px 9px;border-radius:99px;color:var(--ink)}
.m.w{background:transparent;border:1px dashed var(--line);color:var(--mut)}
.m.ok{background:var(--g);color:#fff}
.btn{display:inline-block;text-decoration:none;background:var(--g);color:#fff;border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}
input.s{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.filters .chip{white-space:nowrap}.filters .chip.on{background:var(--g);color:#fff;border-color:var(--g)}
ol.stops{margin:10px 0 0;padding-left:20px;color:var(--ink)}ol.stops li{padding:2px 0}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--g2)}
.money{font-size:30px;font-weight:800;letter-spacing:-.02em}
.gold{color:var(--gold)}
.area{width:92px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:right}
.empty{text-align:center;padding:60px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:20px}
nav.tabs button.on{color:var(--g);font-weight:700}
small.note{color:var(--mut);display:block;margin-top:10px;font-size:13px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .p{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
.sheet label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}
.sheet input,.sheet select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:20px}
.acts .btn{flex:1;text-align:center;border:0;padding:13px}
.btn.d{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.fab{position:fixed;right:16px;bottom:76px;z-index:7;background:var(--gold);color:#1c1c1c;border:0;border-radius:99px;padding:13px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ed{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;display:none}
.late{background:var(--warn);color:#fff}.today{background:var(--gold);color:#1c1c1c;font-weight:700}
.vcard{border-left:4px solid var(--line)}.vcard.l{border-left-color:var(--warn)}.vcard.h{border-left-color:var(--gold)}
nav.tabs button{font-size:11.5px}
.dot{background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:3px}
/* colheita */
button.btn{border:0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.hrow .mn{font-weight:700}
.hrow .d{font-size:12.5px;color:var(--mut)}
.hrow .v{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hrow .v small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.win{color:var(--g);font-weight:700}.lose{color:var(--warn);font-weight:700}
.hit{border:1px solid var(--line);border-radius:14px;padding:2px 12px 12px;margin-top:14px}
.res{margin-top:12px;font-size:14px;background:var(--soft);border-radius:10px;padding:9px 11px;font-variant-numeric:tabular-nums}
.res b{color:var(--g)}
.sheet details{margin-top:12px}
.sheet summary{font-size:13.5px;color:var(--mut);cursor:pointer;padding:6px 0}
button.m{font:inherit;font-size:12.5px;cursor:pointer}
nav.tabs button{font-size:11px}
.srow{padding:10px 0;border-top:1px solid var(--line)}
.srow .s1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.srow .sn{font-weight:700}.srow .st{font-weight:800;font-variant-numeric:tabular-nums}

.srow .s2 label{display:flex;align-items:center;gap:8px;font-size:12.5px}
.srow .s2 .area{width:88px}
.srow.tot .sn,.srow.tot .st{font-size:15px}
.xtitle{background:#2E5E8E;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:4px}

.xmes select{background:#FFE699;color:#1F3864;font:700 15px Arial,sans-serif;border:1px solid #bf9000;padding:6px 10px;border-radius:2px}
.xhint{font-size:12px;color:var(--mut);margin-bottom:14px}
.xl{margin-bottom:16px;font-family:Arial,sans-serif;background:var(--card);border:1px solid var(--line)}

.xh2{font:700 13px Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:20px 0 8px}
.xt{border-collapse:collapse;width:100%;font-size:13px}

.xt td{padding:4px 6px;border:1px solid var(--line);font-variant-numeric:tabular-nums}

.xt .xtot td{background:#EDEDED;font-weight:700;color:#000}
.xs{border-top:1px solid #bdbdbd}.xsh{background:#D9D9D9;color:#000;font-size:12px;font-weight:700;text-align:center;padding:5px}
.xsv{background:#EDEDED;color:#000;text-align:center;font-weight:700;padding:10px 6px;font-size:15px}

.xsel{background:#FFE699 !important;color:#000 !important;font-weight:700}

function dist(a,b){const dx=(a[1]-b[1])*Math.cos(a[0]*Math.PI/180),dy=a[0]-b[0];return Math.hypot(dx,dy)*111}
function sector(g){
  const dx=(g[1]-BASE[1])*Math.cos(BASE[0]*Math.PI/180),dy=g[0]-BASE[0];
  const a=(Math.atan2(dx,dy)*180/Math.PI+360)%360;
  return ['Norte','Nordeste','Leste','Sudeste','Sul','Sudoeste','Oeste','Noroeste'][Math.round(a/45)%8];
}
function montaRotas(){
  const withG=C.filter(c=>c.gps),used=new Set(),out=[];
  FIXED.forEach(([nome,l])=>{const p=l.map(n=>withG.find(c=>c.nome===n)).filter(Boolean);if(p.length){p.forEach(c=>used.add(c.n));out.push({d:nome,p})}});
  const by={};
  withG.filter(c=>!used.has(c.n)).forEach(c=>{(by[sector(c.gps)]=by[sector(c.gps)]||[]).push(c)});
  Object.keys(by).forEach(k=>out.push({d:'Sentido '+k,p:by[k]}));
  out.forEach(r=>{r.p.sort((a,b)=>dist(BASE,a.gps)-dist(BASE,b.gps));
    const seen=new Set(),pts=[];r.p.forEach(c=>{const k=c.gps.join();if(!seen.has(k)){seen.add(k);pts.push(c.gps.join(','))}});
    r.url='https://www.google.com/maps/dir/'+pts.join('/')});
  return out;
}
function rotas(){
  const R=montaRotas(),sem=C.filter(c=>!c.gps);

}

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const hoje=()=>iso(new Date());
const fdc=s=>{const d=pd(s);return ['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()]+' '+fd(s).slice(0,5)};
function proxVisita(c){
  if(!c.plantio)return null;
  const v=(c.visitas||[]).slice().sort();
  return v.length?addD(v[v.length-1],7):addD(c.plantio,7);
}
function visitStats(){
  const h=hoje();let atr=0,hj=0;
  C.forEach(c=>{const p=proxVisita(c);if(!p)return;if(p<h)atr++;else if(p===h)hj++});
  return {atr,hj};
}
async function feita(n,undo){
  const c=C.find(x=>x.n===n);const v=(c.visitas||[]).slice();
  if(undo)v.pop();else v.push(hoje());
  c.visitas=v;renderAll();
  if(await save(c))toast(undo?'Visita desfeita':'Visita registrada');
}
function visitas(){
  const h=hoje(),lim=addD(h,7);
  const L=C.filter(c=>c.plantio).map(c=>({c,p:proxVisita(c)})).sort((a,b)=>a.p.localeCompare(b.p));
  const grp=[['Atrasadas',x=>x.p<h,'l'],['Hoje',x=>x.p===h,'h'],['Próximos 7 dias',x=>x.p>h&&x.p<=lim,''],['Mais adiante',x=>x.p>lim,'']];
  const card=(x,cl)=>{const c=x.c,v=c.visitas||[],d=diff(h,x.p);
    const tag=d>0?`<span class="m late">${d} dia${d>1?'s':''} de atraso</span>`:d===0?'<span class="m today">hoje</span>':`<span class="m">${fdc(x.p)}</span>`;

/* ---- Colheita (mesmas contas da planilha de base) ---- */
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:null};
const f1=n=>n==null?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function calcItem(it,esp,base){
  const l=num(it.linhas),cp=num(it.comp),kg=num(it.kg),um=num(it.um),e=num(esp),b=num(base)??14;
  const area=l>0&&cp>0&&e>0?l*cp*e/10000:null;
  const bruto=area&&kg!=null?kg/area/60:null;
  const corr=bruto!=null&&um!=null?bruto*(100-um)/(100-b):null;
  return {area,bruto,corr};
}
const colhido=c=>!!(c.colheita&&(c.colheita.itens||[]).some(i=>num(i.kg)!=null));
const resC=c=>(c.colheita.itens||[]).map(it=>({...it,...calcItem(it,c.colheita.esp,c.colheita.base)}));
const pct=b=>String(num(b)??14).replace('.',',')+'%';
function prevColheita(c){
  if(!c.plantio||!c.ciclo)return null;
  const m=String(c.ciclo).match(/\d+/g);if(!m)return null;
  return addD(c.plantio,Math.max(...m.map(Number)));
}
function colheita(){
  const H=C.filter(colhido).sort((a,b)=>(b.colheita.data||'').localeCompare(a.colheita.data||''));
  const P=C.filter(c=>!colhido(c)&&c.plantio).map(c=>({c,p:prevColheita(c)})).sort((a,b)=>(a.p||'9').localeCompare(b.p||'9'));
  const W=C.filter(c=>!colhido(c)&&!c.plantio);
  let sa=0,sb=0,nd=0,w=0;
  H.forEach(c=>{const r=resC(c);if(r.length>1&&r[0].corr!=null&&r[1].corr!=null){sa+=r[0].corr;sb+=r[1].corr;nd++;if(r[0].corr>r[1].corr)w++}});
  const top=H.length?`<div class="grid">
    <div class="stat"><b>${H.length}/${C.length}</b><span>clientes colhidos</span></div>
    <div class="stat"><b>${nd?w+'/'+nd:'—'}</b><span>cultivar à frente do concorrente</span></div>
    <div class="stat"><b>${nd?f1(sa/nd):'—'}</b><span>média cultivar · sc/ha</span></div>
    <div class="stat"><b>${nd?f1(sb/nd):'—'}</b><span>média concorrente · sc/ha</span></div></div>`
  :`<div class="card"><b>Nenhuma colheita lançada ainda</b><small class="note" style="margin-top:4px">Toque em "Lançar colheita" no cliente e informe linhas, comprimento, peso da parcela e umidade. O app calcula a área, as sacas por hectare e a correção de umidade.</small></div>`;
  const hc=c=>{const h=c.colheita,r=resC(c);let d='';
    if(r.length>1&&r[0].corr!=null&&r[1].corr!=null){const x=r[0].corr-r[1].corr;
      d=`<div class="${x>=0?'win':'lose'}" style="margin-top:10px">${esc(r[0].mat||'Cultivar')}: ${x>=0?'+':'−'}${f1(Math.abs(x))} sc/ha em relação a ${esc(r[1].mat||'concorrente')}</div>`}
    return `<div class="card"><div class="row"><span class="nm">${esc(c.nome)}</span>${h.data?`<span class="m ok">Colhido ${fd(h.data)}</span>`:''}</div>
    <div style="margin-top:8px">${r.map(it=>`<div class="hrow"><div style="min-width:0"><div class="mn">${esc(it.mat||'—')}</div><div class="d">${it.bruto!=null?f1(it.bruto)+' sc/ha sem correção':'faltam dados para calcular'}${num(it.um)!=null?' · umidade '+f1(num(it.um))+'%':''}</div></div><div class="v">${f1(it.corr)} <small>sc/ha a ${pct(h.base)}</small></div></div>`).join('')}</div>${d}
    <div class="acts" style="margin-top:12px"><button class="ed" data-h="${c.n}">Editar colheita</button></div></div>`};
  const pc=x=>{const c=x.c;return `<div class="card"><div class="row" style="align-items:center"><div style="min-width:0"><div class="nm">${esc(c.nome)}</div><div style="font-size:14px;color:var(--mut)">${esc(c.cult)} x ${esc(c.conc||'—')}</div></div><button class="btn" data-h="${c.n}">Lançar colheita</button></div>
    <div class="meta" style="margin-top:8px"><span class="m">Plantio ${fd(c.plantio)}</span>${x.p?`<span class="m">Previsão ${fd(x.p)}</span>`:'<span class="m w">sem ciclo informado</span>'}</div></div>`};
  $('#v-colheita').innerHTML=top+
    (H.length?`<div class="sec">Colhidos (${H.length})</div>`+H.map(hc).join(''):'')+
    (P.length?`<div class="sec">A colher (${P.length})</div>`+P.map(pc).join(''):'')+
    (W.length?`<div class="sec">Aguardando plantio (${W.length})</div><div class="card"><div class="meta">${W.map(c=>`<button class="m w" data-h="${c.n}">${esc(c.nome)}</button>`).join('')}</div><small class="note">Toque no nome para lançar a colheita mesmo sem data de plantio.</small></div>`:'')+
    `<small class="note">Sacas de 60 kg. Previsão = plantio + ciclo da cultivar.</small>`;

}

}

function parseGps(s){
  s=(s||'').trim();if(!s)return null;
  let m=s.match(/(-?\d+[.,]\d+)\s*[,;\s]\s*(-?\d+[.,]\d+)/);
  if(m)return [parseFloat(m[1].replace(',','.')),parseFloat(m[2].replace(',','.'))];
  m=s.match(/(\d+)°(\d+)'([\d.,]+)"?\s*([NS])\s*(\d+)°(\d+)'([\d.,]+)"?\s*([EW])/i);
  if(m){const f=(d,mi,se,h)=>{let v=+d+ +mi/60+parseFloat(se.replace(',','.'))/3600;return /[SW]/i.test(h)?-v:v};
    return [f(m[1],m[2],m[3],m[4]),f(m[5],m[6],m[7],m[8])].map(x=>Math.round(x*1e6)/1e6)}
  return undefined;
}

/* ---- Sincronização com GitHub (repositório privado de dados) ---- */
const REPO='matheusadamagro/adam-agro-dados',FILE='dados.json';
let syncing=false,lastSync=LS('adam_last')||null;
const tok=()=>{try{return localStorage.getItem('adam_token')||''}catch(e){return ''}};
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
let lastTxt='Sincronizar';
function stat(t,ok){if(t!==undefined)lastTxt=t;const x=lastTxt+(FP?' · 📷'+FP:'');const e=$('#syncSt');if(e){e.textContent=x;if(ok!==undefined)e.dataset.st=ok?'1':'0'}const d=$('#cfgSt');if(d)d.textContent=x}
function ghx(method,body){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+(method==='GET'?'?t='+Date.now():''),
    {method,cache:'no-store',headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
}
async function sync(retry){
  if(syncing)return;
  if(!tok()){stat('Sem token — toque em ⚙',false);return}
  if(!navigator.onLine){stat('Offline — salvo no celular',false);return}
  syncing=true;stat('Sincronizando…',true);
  try{
    const r=await ghx('GET');let rem={clientes:[],del:{}},sha=null;
    if(r.status===200){const j=await r.json();sha=j.sha;rem=JSON.parse(b64d(j.content));rem.clientes=rem.clientes||[];rem.del=rem.del||{}}
    else if(r.status===401||r.status===403){stat('Token inválido ou sem permissão',false);return}
    else if(r.status!==404){stat('Erro '+r.status,false);return}
    const lm={},rm={};C.forEach(c=>lm[c.n]=c);rem.clientes.forEach(c=>rm[c.n]=c);
    const del={...rem.del};Object.keys(META.del).forEach(k=>{del[k]=Math.max(del[k]||0,META.del[k])});
    let push=false;const out=[];
    new Set([...Object.keys(lm),...Object.keys(rm)]).forEach(k=>{
      const l=lm[k],m=rm[k],lu=l?l.upd||0:-1,mu=m?m.upd||0:-1,d=del[k]||0;
      const win=lu>mu?l:(m||l);
      if(d&&d>=(win.upd||0)){if(m)push=true;return}
      if(!m||lu>mu)push=true;
      out.push(win);
    });
    out.sort((a,b)=>a.n-b.n);
    Object.keys(del).forEach(k=>{if(JSON.stringify(del[k])!==JSON.stringify(rem.del[k]))push=true});
    META.del=del;
    const busy=$('#sheet').classList.contains('on')||['area','s'].includes(document.activeElement.className)||document.activeElement.id==='busca';
    const changed=JSON.stringify(out)!==JSON.stringify(C);
    C=out;persist();
    if(push||r.status===404){
      const w=await ghx('PUT',{message:'sync '+new Date().toISOString(),content:b64e(JSON.stringify({v:1,atualizado:new Date().toISOString(),clientes:out,del},null,1)),sha:sha||undefined});
      if(w.status===409||w.status===422){syncing=false;if(!retry)return sync(true);stat('Conflito, tente de novo',false);return}
      if(!w.ok){stat('Erro ao enviar '+w.status,false);return}
    }
    lastSync=new Date().toISOString();LS('adam_last',lastSync);
    stat('Sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),true);
    if(changed&&!busy)renderAll();
  }catch(e){stat('Sem conexão — salvo no celular',false)}
  finally{syncing=false;subirFotos()}
}
function backupExport(){
  const txt=JSON.stringify({v:1,exportado:new Date().toISOString(),clientes:C,del:META.del,sim:{vd:LS('adam_sim_vd'),canal:LS('adam_sim_canal')}},null,1);
  const f=new File([txt],'adam-agro-backup-'+hoje()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
}
function backupImport(file){
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.clientes))throw 0;
    const t=Date.now();C=j.clientes.map(c=>({...c,upd:t}));META.del={};persist();renderAll();toast('Backup importado');setTimeout(sync,200)}catch(e){toast('Arquivo inválido')}};r.readAsText(file);
}

/* ---- Fotos (guardadas no celular e enviadas ao GitHub quando há internet) ---- */
let subindo=false;
const IDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('adam_fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idb=async(mode,fn)=>{const d=await IDB();return new Promise((res,rej)=>{const t=d.transaction('f',mode),r=fn(t.objectStore('f'));t.oncomplete=()=>{d.close();res(r&&r.result)};t.onerror=()=>rej(t.error)})};
const fAll=()=>idb('readonly',s=>s.getAll()).then(x=>x||[]).catch(()=>[]);
const fPut=o=>idb('readwrite',s=>s.put(o));
const fDel=id=>idb('readwrite',s=>s.delete(id));
async function refreshFotos(){
  const L=await fAll();FP=L.filter(x=>!x.sent).length;FC={};L.forEach(x=>FC[x.n]=(FC[x.n]||0)+1);
  if(typeof stat==='function')stat();
}
function comprime(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
const pad=n=>String(n).padStart(2,'0');
function nomeArq(f){const d=new Date(f.ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'_'+f.id.slice(-4)+'.jpg'}
async function addFotos(n,files){
  let ok=0;
  for(const file of files){try{const blob=await comprime(file);const ts=Date.now();await fPut({id:ts+''+Math.floor(1000+Math.random()*9000),n,ts,blob,sent:false});ok++}catch(e){}}
  await refreshFotos();toast(ok?ok+' foto'+(ok>1?'s':'')+' salva'+(ok>1?'s':'')+' no celular':'Não consegui salvar a foto');
  setTimeout(()=>{try{sync()}catch(e){}},300);
}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function subirFotos(){
  if(subindo||!tok()||!navigator.onLine)return;subindo=true;
  try{
    const L=(await fAll()).filter(x=>!x.sent&&x.blob);
    for(const f of L){
      const c=C.find(x=>x.n===f.n);if(!c||!String(c.nome||'').trim())continue;
      const nome=c.nome.replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim(),path='fotos/'+nome+'/'+nomeArq(f);
      const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),
        {method:'PUT',headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'foto '+nome,content:await blobB64(f.blob)})});
      if(r.ok||r.status===422){await fPut({id:f.id,n:f.n,ts:f.ts,sent:true,path});await refreshFotos()}
      else break;
    }
  }catch(e){}
  finally{subindo=false;refreshFotos()}
}
async function drawFotos(n){
  const box=document.getElementById('fotosBox');if(!box)return;
  const L=(await fAll()).filter(x=>x.n===n),pend=L.filter(x=>!x.sent);
  box.innerHTML=`<div style="font-size:13.5px;color:var(--mut);margin:2px 0 8px">${L.length?L.length+' foto'+(L.length>1?'s':'')+' · '+(pend.length?pend.length+' aguardando internet':'todas enviadas ✓'):'Nenhuma foto ainda'}</div>
  <div class="meta">${pend.map(x=>`<span style="position:relative;display:inline-block"><img data-fid="${x.id}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"><button type="button" data-fx="${x.id}" style="position:absolute;top:-6px;right:-6px;border:0;border-radius:99px;background:var(--warn);color:#fff;width:22px;height:22px;font-size:12px">✕</button></span>`).join('')}</div>`;
  pend.forEach(x=>{const im=box.querySelector(`[data-fid="${x.id}"]`);if(im&&x.blob)im.src=URL.createObjectURL(x.blob)});
  box.querySelectorAll('[data-fx]').forEach(b=>b.onclick=async()=>{await fDel(b.dataset.fx);await refreshFotos();drawFotos(n)});
}
function bindFotos(n){
  drawFotos(n);
  const go=async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length){await addFotos(n,fs);drawFotos(n)}};
  $('#f_cam').onclick=()=>$('#f_in1').click();$('#f_gal').onclick=()=>$('#f_in2').click();
  $('#f_in1').onchange=go;$('#f_in2').onchange=go;
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
